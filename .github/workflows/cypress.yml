name: Cypress Cucumber Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./CypressCucumberPro

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: ▶️ Run Cypress tests
        run: npx cypress run

      - name: ⬆️ Upload test videos
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: ./CypressCucumberPro/cypress/videos/

      - name: ⬆️ Upload test screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: ./CypressCucumberPro/cypress/screenshots/
